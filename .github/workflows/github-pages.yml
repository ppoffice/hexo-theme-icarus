name: GitHub Pages

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx hexo algolia
        if: github.ref == 'refs/heads/site'
        env:
          HEXO_ALGOLIA_INDEXING_KEY: ${{ secrets.HEXO_ALGOLIA_INDEXING_KEY }}
      - run: NODE_ENV=production npx hexo g
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/site'
        with:
          path: public

  # Only this job uses the github-pages environment: its protection rules only allow the site
  # branch, so a job with the environment would fail on every other branch.
  deploy:
    if: github.ref == 'refs/heads/site'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
